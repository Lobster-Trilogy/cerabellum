characters:

  lelouch:
    display_name: "Lelouch Lamperouge"
    shorthand: "l"
    colour: "#8B0000"
    side_image: True
    flower: "spider_lily"

    defaults:
      position: center
      transition: t_default
      base: school_uniform
      eyes: contacts

    bases:
      school_uniform: "lelouch/base_school"
      mansion_casual: "lelouch/base_mansion"
      zero_coat:      "lelouch/base_zero"

    expressions:
      neutral:        "lelouch/expr_neutral"
      sharp:          "lelouch/expr_sharp"
      soft:           "lelouch/expr_soft"
      cold:           "lelouch/expr_cold"
      smile_almost:   "lelouch/expr_smile_almost"
      smile_real:     "lelouch/expr_smile_real"
      frustrated:     "lelouch/expr_frustrated"
      mark_active:    "lelouch/expr_mark"
      
    eyes:
      contacts:       "lelouch/eyes_contacts"
      vampire:        "lelouch/eyes_vampire"
      masked:         "lelouch/eyes_masked"

    states:
      school_neutral:
        base: school_uniform
        expression: neutral
        eyes: contacts

      mansion_soft:
        base: mansion_casual
        expression: soft
        eyes: vampire
        note: "c.c. and nunnally specific"

      zero_masked:
        base: zero_coat
        expression: cold
        eyes: masked
        note: "Zero is a performance"

      zero_unmasked:
        base: zero_coat
        expression: cold
        eyes: vampire
        warning: "act 24 only"

      mark_activated:
        base: mansion_casual
        expression: mark_active
        eyes: vampire
        warning: "use t_weighted"

        # c.c.
